<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mockwire 대시보드 (테스트용)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; }
  input { display: block; width: 100%; margin-bottom: .5rem; padding: .4rem; box-sizing: border-box; }
  button { padding: .5rem 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
  th, td { text-align: left; border-bottom: 1px solid #ddd; padding: .4rem; }
</style>
</head>
<body>
  <h1>test-project / users</h1>
  <form id="form">
    <input id="name" placeholder="name" required>
    <input id="email" placeholder="email" required>
    <button type="submit">추가</button>
  </form>
  <table>
    <thead><tr><th>id</th><th>name</th><th>email</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const API = '/p/test-project/users';

async function loadUsers() {
  const res = await fetch(API);
  const users = await res.json();
  document.getElementById('rows').innerHTML = users
    .map(u => `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td></tr>`)
    .join('');
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email }),
  });
  e.target.reset();
  await loadUsers(); // 재시작 없이, 방금 POST한 결과가 바로 목록에 보여야 함
});

loadUsers();
</script>
</body>
</html>
